name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm db:migrate
      # Unit, integration and e2e for every package, with coverage; fails if a critical module
      # drops below its threshold.
      - run: pnpm test:coverage
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn

  # Builds both images the way a reviewer's `docker compose up` does and runs the smoke test:
  # migrate exits 0, api/worker/web healthy, 3 seeded documents, extracted by the test-only fake
  # extractor (no LLM key in CI), and a second `up` reseeds nothing.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (BuildKit layer cache in GitHub Actions)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,web
          load: true
          set: |
            *.cache-from=type=gha,scope=doc-review
            *.cache-to=type=gha,mode=max,scope=doc-review
      - name: Smoke test
        run: scripts/smoke.sh --no-build --with-fake-llm
      - name: Restart test (worker killed mid-extraction)
        run: scripts/restart-test.sh --no-build --kill
