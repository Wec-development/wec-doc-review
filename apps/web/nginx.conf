# Review UI: static files plus a same-origin proxy to the API (no CORS, no build-time API URL).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's embedded DNS. The API address is looked up at request time (through the variable
    # below), so restarting or recreating the api container never leaves nginx with a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers, sent with every response. Caching below uses `expires`, not add_header,
    # because an add_header inside a location would drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Everything is same-origin (self-hosted fonts, /api). Inline style *attributes* are allowed
    # for the progress bar's dynamic widths; stylesheets and scripts must come from this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API: /api/documents -> http://api:3000/documents
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A little above the API's 10 MB upload limit, so the API answers an oversized upload
        # with its JSON error (413) instead of nginx's HTML page.
        client_max_body_size 11m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite's hashed build output: safe to cache for a long time.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # The app shell must always be revalidated so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths (/documents/…, /settings) load the shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
